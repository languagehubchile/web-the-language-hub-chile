<style>
  /* Layout concept: engineered grid. Dark petroleum bands carry structure; titanium cards carry content; ochre appears only on CTAs and seals. Single committed look (brand palette). */
  :root {
    --petrol: #005B5C; --petrol-deep: #00393A; --ochre: #C19A6B;
    --ti-50: #F4F6F7; --ti-200: #DCE1E3; --ink: #1B2124;
    color-scheme: light;
  }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--ti-50); color: var(--ink);
    font-family: 'Plus Jakarta Sans', Inter, system-ui, sans-serif; font-size: 16px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: #00393A; z-index: 60; }
  .wrap {
    max-width: 1200px; margin-inline: auto; box-sizing: border-box; width: 100%;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  h1, h2, h3 { text-wrap: balance; letter-spacing: -0.02em; }
  .grid-bg {
    background-image:
      linear-gradient(rgba(255,255,255,0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.055) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .grid-bg-light {
    background-image:
      linear-gradient(rgba(0,91,92,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,91,92,0.06) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .eyebrow { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
  .btn-ochre {
    background: #C19A6B; color: #1B2124; font-weight: 700; transition: background .15s, transform .15s;
  }
  .btn-ochre:hover { background: #CDAA7E; }
  .btn-ochre:active { transform: translateY(1px); }
  :focus-visible { outline: 2px solid #C19A6B; outline-offset: 2px; }
  .modal-in { animation: modalIn .22s ease-out; }
  @keyframes modalIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 2.2s .3s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .pulse { animation: pulse 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0%, 100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.4); } }
  .flow { stroke-dasharray: 3 7; animation: flow 4s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -80; } }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .modal-in { animation: none; }
    .draw { animation: none; stroke-dashoffset: 0; }
    .pulse, .flow { animation: none; }
  }
  select, input, textarea { font: inherit; }
  .field {
    width: 100%; box-sizing: border-box; background: #fff; border: 1px solid #C4CBCE; border-radius: 2px;
    padding: 0.7rem 0.85rem; color: #1B2124; min-height: 46px;
  }
  .field:focus { border-color: #005B5C; outline: 2px solid rgba(0,91,92,.25); outline-offset: 0; }
</style>

function Modal({ onClose, label, children, wide }) {
  const ref = useRef(null);
  useEffect(() => {
    const prev = document.activeElement;
    const onKey = e => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    const old = document.body.style.overflow; document.body.style.overflow = 'hidden';
    if (ref.current) ref.current.focus();
    return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = old; if (prev && prev.focus) prev.focus(); };
  }, []);
  return html`
  <div className="fixed inset-0 z-[70] flex items-end sm:items-center justify-center p-0 sm:p-6" style=${{ background: 'rgba(0,30,31,0.78)' }} onMouseDown=${e => { if (e.target === e.currentTarget) onClose(); }}>
    <div ref=${ref} tabIndex=${-1} role="dialog" aria-modal="true" aria-label=${label} className=${'modal-in relative bg-white w-full max-h-[92vh] overflow-y-auto outline-none ' + (wide ? 'sm:max-w-4xl' : 'sm:max-w-3xl')}>

  </div>`;
}

            ${i === 0 && html`<p className="eyebrow text-ti-500 mb-3">${t.notes.title}</p>` || html`<p className="eyebrow text-ti-500 mb-3 opacity-0 select-none hidden md:block" aria-hidden="true">${t.notes.title}</p>`}
            <h3 className="font-bold text-ti-900">${a}</h3><p className="mt-1.5 text-sm text-ti-700">${b}</p>
          </div>`)}
      </div>
      <p className="mt-8 text-sm text-ti-500 max-w-3xl">${t.ip}</p>
    </div>
  </section>`;
}

/* =========================================================
   FORM + FOOTER
   ========================================================= */
function ContactForm({ lang, interest, setInterest }) {
  const t = T[lang].form; const [sent, setSent] = useState(false); const [busy, setBusy] = useState(false);
  const submit = async e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target).entries());
    setBusy(true);
    /* Production: POST `data` to your backend / CRM endpoint here. */
    await new Promise(r => setTimeout(r, 600));
    setBusy(false); setSent(true);
  };
  const lbl = 'block text-[0.78rem] font-semibold text-ti-700 mb-1.5';
  return html`
  <section id="contacto" className="scroll-mt-16 py-20 md:py-28 text-white grid-bg" style=${{ background: 'linear-gradient(170deg,#00393A 0%,#002A2B 100%)' }}>
    <div className="wrap grid lg:grid-cols-12 gap-12 items-start">
      <div className="lg:col-span-5 min-w-0">
        <p className="eyebrow text-white/70">${t.eyebrow}</p>
        <h2 className="mt-3 text-3xl md:text-[2.5rem] leading-tight font-bold">${t.h2}</h2>
        <p className="mt-5 text-white/80 text-lg leading-relaxed">${t.lead}</p>
        <ul className="mt-8 space-y-3">${t.points.map(p => html`<li key=${p} className="flex gap-3 items-center text-white/90"><span className="text-white"><${Icon} d=${ICONS.check} size=${18} sw=${2} /></span>${p}</li>`)}</ul>
      </div>
      <div className="lg:col-span-7 bg-white text-ti-900 p-6 md:p-9 min-w-0">
        ${sent ? html`
          <div className="py-10 text-center" role="status">
            <span className="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-petrol text-white"><${Icon} d=${ICONS.check} size=${26} sw=${2} /></span>
            <h3 className="mt-5 text-2xl font-bold">${t.okTitle}</h3>
            <p className="mt-2 text-ti-700 max-w-md mx-auto">${t.ok}</p>
            <button onClick=${() => setSent(false)} className="mt-7 text-sm font-bold text-petrol underline underline-offset-4">${t.again}</button>
          </div>` : html`
          <form onSubmit=${submit} className="grid sm:grid-cols-2 gap-5">
            <div><label className=${lbl} htmlFor="f-name">${t.name}</label><input id="f-name" name="name" required autoComplete="name" className="field" /></div>
            <div><label className=${lbl} htmlFor="f-title">${t.title}</label><input id="f-title" name="title" required autoComplete="organization-title" className="field" /></div>
            <div className="sm:col-span-2"><label className=${lbl} htmlFor="f-email">${t.email}</label><input id="f-email" name="email" type="email" required autoComplete="email" className="field" /></div>
            <div><label className=${lbl} htmlFor="f-industry">${t.industry}</label>
              <select id="f-industry" name="industry" required defaultValue="" className="field"><option value="" disabled>${t.select}</option>${t.industries.map(o => html`<option key=${o} value=${o}>${o}</option>`)}</select></div>
            <div><label className=${lbl} htmlFor="f-size">${t.size}</label>
              <select id="f-size" name="size" required defaultValue="" className="field"><option value="" disabled>${t.select}</option>${t.sizes.map(o => html`<option key=${o} value=${o}>${o}</option>`)}</select></div>
            <div className="sm:col-span-2"><label className=${lbl} htmlFor="f-interest">${t.interest}</label>
              <select id="f-interest" name="interest" value=${interest} onChange=${e => setInterest(e.target.value)} className="field">${t.interests.map((o, i) => html`<option key=${i} value=${String(i)}>${o}</option>`)}</select></div>
            <div className="sm:col-span-2">
              <button type="submit" disabled=${busy} className="btn-ochre w-full sm:w-auto px-7 py-3.5 text-sm rounded-sm disabled:opacity-60">${busy ? t.sending : t.submit}</button>
              <p className="mt-4 text-xs text-ti-500">${t.privacy}</p>
            </div>
          </form>`}
      </div>
    </div>
  </section>`;
}

function Footer({ lang }) {
  const t = T[lang].footer;
  return html`
  <footer style=${{ background: '#00292A' }} className="text-white">
    <div className="wrap py-14 grid md:grid-cols-12 gap-10">
      <div className="md:col-span-4 min-w-0">
        <${Logo} large=${true} />
        <p className="mt-5 text-sm text-ochre font-medium">${t.tagline}</p>
      </div>
      <div className="md:col-span-3 min-w-0"><h4 className="eyebrow text-white/60">${t.contactT}</h4>
        <p className="mt-3 text-sm text-white/85 break-words select-all">${CONTACT_EMAIL}</p>
        <p className="mt-1 text-sm text-white/85">Chile</p></div>
      <div className="md:col-span-5 min-w-0 grid gap-6">
        <div><h4 className="eyebrow text-white/60">${t.govT}</h4><p className="mt-3 text-sm text-white/75 leading-relaxed">${t.gov}</p></div>
        <div><h4 className="eyebrow text-white/60">${t.legalT}</h4><p className="mt-3 text-sm text-white/75 leading-relaxed">${t.legal}</p></div>
      </div>
    </div>
    <div className="border-t border-white/10">
      <div className="wrap py-5 text-xs text-white/60">© 2026 The Language Hub - Chile. ${t.rights}</div>
    </div>
  </footer>`;
}

/* =========================================================
   APP
   ========================================================= */
function App() {
  const [lang, setLangState] = useState(() => {
    try { const s = localStorage.getItem('tlh-lang'); if (LANGS.includes(s)) return s; } catch (e) {}
    const n = (navigator.language || 'es').slice(0, 2); return LANGS.includes(n) ? n : 'es';
  });
  const setLang = l => { setLangState(l); try { localStorage.setItem('tlh-lang', l); } catch (e) {} };
  const [modal, setModal] = useState(null);
  const [interest, setInterest] = useState('0');
  useEffect(() => { document.documentElement.lang = T[lang].htmlLang; }, [lang]);

  const goForm = (i) => { setModal(null); setInterest(String(i)); setTimeout(() => scrollToId('contacto'), 60); };
  const quoteFor = id => goForm(id === 'exec' ? 1 : id === 'incompany' ? 2 : 3);

  return html`
    <${Navbar} lang=${lang} setLang=${setLang} onCta=${() => goForm(0)} />
    <main>
      <${Hero} lang=${lang} onCta=${() => goForm(0)} onVideo=${() => setModal({ t: 'video' })} />
      <${Proof} lang=${lang} />
      <${Problem} lang=${lang} />
      <${Programs} lang=${lang} onOpen=${id => setModal({ t: 'program', id })} />
      <${Method} lang=${lang} />
      <${Insights} lang=${lang} onRequest=${() => goForm(4)} onOpen=${i => setModal({ t: 'paper', i })} />
      <${ContactForm} lang=${lang} interest=${interest} setInterest=${setInterest} />
    </main>
    <${Footer} lang=${lang} />
    ${modal && modal.t === 'program' && html`<${ProgramModal} key=${modal.id + lang} lang=${lang} id=${modal.id} onClose=${() => setModal(null)} onQuote=${quoteFor} />`}
    ${modal && modal.t === 'paper' && html`<${PaperModal} key=${'p' + modal.i + lang} lang=${lang} i=${modal.i} onClose=${() => setModal(null)} onRequest=${() => goForm(4)} />`}
    ${modal && modal.t === 'video' && html`<${VideoModal} lang=${lang} onClose=${() => setModal(null)} onCta=${() => goForm(0)} />`}
  `;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>

</body></html>
